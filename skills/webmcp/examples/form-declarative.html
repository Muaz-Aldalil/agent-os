<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Declarative WebMCP Form Example</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #ffffff;
      --text: #1e293b;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 1rem;
      color: var(--text);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      border: 1px solid #e2e8f0;
      padding: 1.5rem;
      border-radius: 8px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* WebMCP Declarative Pseudo-Classes */
    form:tool-form-active {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    button:tool-submit-active {
      background-color: var(--primary);
      color: white;
      transform: scale(1.02);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    input, select, button {
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
    }

    button {
      background: #0f172a;
      color: white;
      cursor: pointer;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <h1>Flight Booking Query (WebMCP Declarative Tool)</h1>
  <p>This form is synthesized by the browser as a callable WebMCP tool using semantic HTML attributes.</p>

  <!-- 
    Declarative Tool Declaration:
    - toolname: Unique tool name exposed to AI agents
    - tooldescription: Explanation of purpose and output
    - toolautosubmit: Allows agent submission without requiring manual click
  -->
  <form
    id="flight-form"
    action="/api/flights/search"
    method="POST"
    toolname="search_flights"
    tooldescription="Searches flight inventory between departure and destination cities on a given date."
    toolautosubmit>

    <div class="form-group">
      <label for="origin">Departure City / Airport:</label>
      <input
        type="text"
        id="origin"
        name="origin"
        toolparamdescription="3-letter airport code or city name (e.g. JFK or New York)"
        required
        placeholder="e.g. SFO">
    </div>

    <div class="form-group">
      <label for="dest">Destination City / Airport:</label>
      <input
        type="text"
        id="dest"
        name="destination"
        toolparamdescription="3-letter airport code or destination city (e.g. LHR or London)"
        required
        placeholder="e.g. HND">
    </div>

    <div class="form-group">
      <label for="date">Travel Date:</label>
      <input
        type="date"
        id="date"
        name="travelDate"
        toolparamdescription="Flight departure date in YYYY-MM-DD format"
        required>
    </div>

    <button type="submit" id="submit-btn">Search Flights</button>
  </form>

  <div id="results" style="margin-top: 2rem;"></div>

  <script>
    // Handle agent or user submission using SubmitEvent.respondWith
    const form = document.getElementById("flight-form");
    const resultsContainer = document.getElementById("results");

    form.addEventListener("submit", (event) => {
      // Check if submission was triggered by an AI agent
      const isAgent = event.agentInvoked || false;

      // Extract form data
      const formData = new FormData(form);
      const payload = {
        origin: formData.get("origin"),
        destination: formData.get("destination"),
        travelDate: formData.get("travelDate")
      };

      // Mock search operation
      const searchPromise = (async () => {
        // Prevent full page navigation
        event.preventDefault();

        // Update UI
        resultsContainer.innerHTML = `<p>Searching flights from <strong>${payload.origin}</strong> to <strong>${payload.destination}</strong> for ${payload.travelDate}...</p>`;

        // Simulate async flight API fetch
        await new Promise(r => setTimeout(r, 600));

        const mockFlights = [
          { flightNumber: "AI-101", origin: payload.origin, destination: payload.destination, departure: "08:30", priceCents: 45000 },
          { flightNumber: "AI-204", origin: payload.origin, destination: payload.destination, departure: "14:15", priceCents: 52000 }
        ];

        // Render DOM results
        resultsContainer.innerHTML = `
          <h3>Available Flights:</h3>
          <ul>
            ${mockFlights.map(f => `<li>${f.flightNumber}: departs ${f.departure} - $${(f.priceCents / 100).toFixed(2)}</li>`).join("")}
          </ul>
        `;

        return {
          status: "success",
          flightsFound: mockFlights.length,
          flights: mockFlights
        };
      })();

      // If browser supports SubmitEvent.respondWith (WebMCP specification)
      if (typeof event.respondWith === "function") {
        event.respondWith(searchPromise);
      }
    });
  </script>

</body>
</html>
